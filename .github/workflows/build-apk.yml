name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        name: Prepare web files
        run: |
          mkdir -p www/icons
          [ -f www/index.html ] || cp index.html www/index.html
          [ -f www/manifest.json ] || cp manifest.json www/ 2>/dev/null || true
          [ -f www/sw.js ] || cp sw.js www/ 2>/dev/null || true
          [ -d icons ] && cp -rn icons/. www/icons/ || true
          ls -R www
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set launcher icons
        continue-on-error: true
        run: |
          pip install pillow
          python3 make_icons.py

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fx570EX-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
